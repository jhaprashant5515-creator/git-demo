<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Details Form</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    main {
      width: min(100%, 560px);
    }

    .card {
      padding: 32px;
      border: 1px solid #e1e7f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 40px rgb(25 44 78 / 9%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    .intro {
      margin: 0 0 26px;
      color: #5c667a;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label,
    legend {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd4e1;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid rgb(48 105 220 / 25%);
      outline-offset: 2px;
      border-color: #3069dc;
    }

    input[type="file"] {
      height: auto;
      padding: 8px;
    }

    fieldset {
      margin: 0;
      padding: 0;
      border: 0;
    }

    .gender-options {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .gender-options label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-weight: 400;
    }

    .gender-options input {
      width: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: #245bd1;
    }

    .hint {
      display: block;
      margin-top: 6px;
      color: #69758a;
      font-size: 0.85rem;
    }

    button {
      min-height: 46px;
      padding: 11px 18px;
      border: 0;
      border-radius: 8px;
      background: #245bd1;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1949ae;
    }

    .result-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #e8edf4;
    }

    .result-label {
      color: #5c667a;
      font-weight: 600;
    }

    #photoPreview {
      display: block;
      width: 112px;
      height: 140px;
      margin-top: 8px;
      border: 1px solid #d9e0ea;
      border-radius: 8px;
      object-fit: cover;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 20px;
      }

      .result-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" id="formCard">
      <h1>Personal Details</h1>
      <p class="intro">Enter your details below and submit the form to review them.</p>

      <form id="detailsForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="age">Age</label>
          <input id="age" name="age" type="number" min="1" max="120" required>
        </div>

        <fieldset class="field">
          <legend>Gender</legend>
          <div class="gender-options">
            <label><input name="gender" type="radio" value="Female" required> Female</label>
            <label><input name="gender" type="radio" value="Male"> Male</label>
            <label><input name="gender" type="radio" value="Other"> Other</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="aadhaar">Aadhaar card number</label>
          <input id="aadhaar" name="aadhaar" type="text" inputmode="numeric"
                 pattern="[0-9]{12}" maxlength="12" autocomplete="off"
                 aria-describedby="aadhaarHint" required>
          <small class="hint" id="aadhaarHint">Enter 12 digits.</small>
        </div>

        <div class="field">
          <label for="photo">Passport-size photo</label>
          <input id="photo" name="photo" type="file" accept="image/*">
          <small class="hint">Choose an image file (optional).</small>
        </div>

        <button type="submit">Submit</button>
      </form>
    </section>

    <section class="card" id="resultCard" aria-live="polite" hidden>
      <h1>Submitted Details</h1>
      <p class="intro">Review the information you submitted.</p>
      <div class="result-row"><span class="result-label">Username</span><span id="resultUsername"></span></div>
      <div class="result-row"><span class="result-label">Age</span><span id="resultAge"></span></div>
      <div class="result-row"><span class="result-label">Gender</span><span id="resultGender"></span></div>
      <div class="result-row"><span class="result-label">Aadhaar card</span><span id="resultAadhaar"></span></div>
      <div class="result-row">
        <span class="result-label">Passport-size photo</span>
        <span id="resultPhoto">No photo selected.</span>
      </div>
      <button id="editButton" type="button" style="margin-top: 24px;">Edit details</button>
    </section>
  </main>

  <script>
    const form = document.getElementById("detailsForm");
    const formCard = document.getElementById("formCard");
    const resultCard = document.getElementById("resultCard");
    const photoInput = document.getElementById("photo");
    let photoUrl;

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(form);

      document.getElementById("resultUsername").textContent = data.get("username");
      document.getElementById("resultAge").textContent = data.get("age");
      document.getElementById("resultGender").textContent = data.get("gender");
      document.getElementById("resultAadhaar").textContent = data.get("aadhaar");

      const photoResult = document.getElementById("resultPhoto");
      if (photoUrl) {
        URL.revokeObjectURL(photoUrl);
        photoUrl = undefined;
      }
      photoResult.replaceChildren();
      if (photoInput.files.length > 0) {
        photoUrl = URL.createObjectURL(photoInput.files[0]);
        const image = document.createElement("img");
        image.id = "photoPreview";
        image.src = photoUrl;
        image.alt = "Selected passport-size photo";
        photoResult.append(image);
      } else {
        photoResult.textContent = "No photo selected.";
      }

      formCard.hidden = true;
      resultCard.hidden = false;
    });

    document.getElementById("editButton").addEventListener("click", () => {
      resultCard.hidden = true;
      formCard.hidden = false;
    });
  </script>
</body>
</html>
